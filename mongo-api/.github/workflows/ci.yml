name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Install, Lint, Typecheck, Test
    runs-on: ubuntu-latest

    env:
      NODE_ENV: test
      MONGODB_URI: mongodb://localhost:27017/linkedin_profile_api_test
      LINKEDIN_LI_AT: ''
      LINKEDIN_JSESSIONID: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test -- --passWithNoTests

      - name: Build
        run: npm run build
