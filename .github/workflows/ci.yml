name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: ${{ matrix.api }}
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ matrix.api }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - api: postgres-api
            database_url: postgresql://postgres:postgres@localhost:5432/linkedin_profile_api_test
          - api: mongo-api
            mongodb_uri: mongodb://localhost:27017/linkedin_profile_api_test

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: linkedin_profile_api_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      DATABASE_URL: ${{ matrix.database_url }}
      MONGODB_URI: ${{ matrix.mongodb_uri }}
      LINKEDIN_LI_AT: ''
      LINKEDIN_JSESSIONID: ''

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ${{ matrix.api }}/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test -- --passWithNoTests

      - name: Build
        run: npm run build
